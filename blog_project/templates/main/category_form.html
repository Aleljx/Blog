{% extends 'main/base.html' %}
{% block content %}
    <h2>Додати нову категорію</h2>
    <form method="POST" class="mt-3">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn btn-success">Зберегти категорію</button>
        <a href="{% url 'article_create' %}" class="btn btn-secondary">Назад до поста</a>
    </form>
{% endblock %}
