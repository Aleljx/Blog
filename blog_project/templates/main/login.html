{% extends 'main/base.html' %}
{% block content %}
    <div class="card p-4 shadow-sm">
        <h2>Вхід</h2>
        <form method="POST">
            {% csrf_token %}
            <p>Логін: <input type="text" name="username" class="form-control"></p>
            <p>Пароль: <input type="password" name="password" class="form-control"></p>
            <button class="btn btn-success" type="submit">Увійти</button>
        </form>
    </div>
{% endblock %}
