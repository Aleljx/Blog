{% extends 'main/base.html' %}

{% block content %}
<div class="card shadow-sm p-4">
    <h2>{% if edit_mode %}Редагувати пост{% else %}Створити новий пост{% endif %}</h2>

    <form method="POST" enctype="multipart/form-data" class="mt-3">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Заголовок:</label>
            {{ form.title }}
        </div>

        <div class="mb-3">
            <label class="form-label">Категорія:</label>
            <div class="d-flex gap-2">
                {{ form.category }}
                <a href="{% url 'category_create' %}" class="btn btn-outline-secondary d-flex align-items-center justify-content-center" style="width: 45px;" title="Додати нову категорію">
                    <span style="font-size: 20px;">+</span>
                </a>
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label">Текст статті:</label>
            {{ form.text }}
        </div>

        <div class="mb-3">
            <label class="form-label">Головне фото:</label>
            {{ form.image }}
        </div>

        <div class="mb-3">
            <label class="form-label">Статус:</label>
            {{ form.status }}
        </div>

        <div class="mt-4">
            <button type="submit" class="btn btn-success px-4">Опублікувати</button>
            <a href="{% url 'index' %}" class="btn btn-secondary px-4">Скасувати</a>
        </div>
    </form>
</div>
{% endblock %}
