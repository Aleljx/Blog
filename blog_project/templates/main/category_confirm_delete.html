{% extends 'main/base.html' %}
{% block content %}
    <div class="alert alert-warning mt-4 shadow-sm">
        <h2>⚠️ Видалення категорії</h2>
        <p>Ви впевнені, що бажаєте видалити категорію "<strong>{{ category.name }}</strong>"?</p>
        <p class="text-danger small">Примітка: Це може вплинути на відображення статей у цій категорії.</p>
        <form method="POST">
            {% csrf_token %}
            <button type="submit" class="btn btn-danger">Так, видалити</button>
            <a href="{% url 'index' %}" class="btn btn-secondary">Скасування</a>
        </form>
    </div>
{% endblock %}
