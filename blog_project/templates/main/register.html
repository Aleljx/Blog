{% extends 'main/base.html' %}
{% block content %}
    <div class="card p-4 shadow-sm">
        <h2>Реєстрація</h2>
        <form method="POST">
            {% csrf_token %}
            {{ form.as_p }}
            <button class="btn btn-primary" type="submit">Зареєструватися</button>
        </form>
        <div class="mt-3">
            <small class="text-muted">Вже маєте акаунт? <a href="{% url 'login' %}">Увійти</a></small>
        </div>
    </div>
{% endblock %}
